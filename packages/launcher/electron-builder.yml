# appId and publish.url are the self-update identity: an installed launcher
# finds its registry entry by appId and its feed by the url. Both must stay
# as they are; only the product name and install folder moved to the
# publisher convention (build/installer.nsh).
appId: br.com.yufa.launcher
productName: Yufa Launcher
electronVersion: 43.0.0
directories:
  output: release-builds
files:
  - out/**
  - package.json
# The Compatibility fix (ADR 0003): tools/fetch-dxvk.ts stages d3d9.dll and
# LICENSE into build/dxvk/ (gitignored); they ship under resources/dxvk/.
# build/check-dxvk.cjs fails the build clearly when the folder is not staged.
extraResources:
  - from: build/dxvk
    to: dxvk
    filter:
      - d3d9.dll
      - LICENSE
beforePack: build/check-dxvk.cjs
asar: true
win:
  target: nsis
  icon: build/icon.ico
nsis:
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: false
  menuCategory: Hyped Games
  include: build/installer.nsh
  artifactName: Yufa-Launcher-Setup-${version}.exe
publish:
  provider: generic
  url: https://patch.tosclassic.com/launcher/
